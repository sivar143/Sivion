spring:
  application:
    name: sivion-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sivion}
    username: ${SPRING_DATASOURCE_USERNAME:sivion}
    password: ${SPRING_DATASOURCE_PASSWORD:sivion}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    username: ${SPRING_RABBITMQ_USERNAME:sivion}
    password: ${SPRING_RABBITMQ_PASSWORD:sivion}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8081/realms/sivion}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8081/realms/sivion/protocol/openid-connect/certs}
server:
  port: 8080
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


sivion:
  keycloak:
    realm: ${SIVION_KEYCLOAK_REALM:sivion}
    admin-base-url: ${SIVION_KEYCLOAK_ADMIN_BASE_URL:http://localhost:8081}
    admin-username: ${SIVION_KEYCLOAK_ADMIN_USERNAME:admin}
    admin-password: ${SIVION_KEYCLOAK_ADMIN_PASSWORD:admin}
