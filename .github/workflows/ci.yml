name: CI

on:
  push:
    branches: [main, dev, integration]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run backend tests
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run frontend unit tests
        run: npm test
      - name: Build frontend
        if: ${{ always() }}
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate local compose configuration
        run: docker compose -f docker-compose.local.yml config
      - name: Validate default compose configuration
        run: docker compose -f docker-compose.yml config
      - name: Build application images
        run: docker compose -f docker-compose.yml build backend frontend
      - name: Validate production compose does not use development Keycloak mode
        run: |
          if grep -Eq 'command:.*start-dev|KC_HTTP_ENABLED:.*true' docker-compose.yml; then
            echo "Production Compose contains development-only Keycloak/HTTP settings. Replace them with production hostname and TLS configuration before deployment." >&2
            exit 1
          fi
