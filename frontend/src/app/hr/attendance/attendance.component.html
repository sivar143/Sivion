<section class="panel">
  <div class="toolbar"><div><h2>Attendance</h2><p>Review employee attendance records and check-in/check-out times.</p></div></div>
  <p *ngIf="loadError" class="form-error" role="alert">{{ loadError }}</p>
  <table>
    <thead><tr><th>Date</th><th>Employee</th><th>Status</th><th>Check in</th><th>Check out</th></tr></thead>
    <tbody>
      <tr *ngFor="let item of attendance">
        <td>{{ item.attendanceDate }}</td><td>{{ employeeName(item.employeeId) }}</td><td>{{ item.status }}</td>
        <td>{{ item.checkIn || '—' }}</td><td>{{ item.checkOut || '—' }}</td>
      </tr>
      <tr *ngIf="!attendance.length"><td colspan="5" class="empty">No attendance records found.</td></tr>
    </tbody>
  </table>
</section>
